<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vanilla integration · Milkdown Notes</title><link rel="stylesheet" href="/editor/style.css"><style>body{margin:32px auto;max-width:1100px;padding:0 24px;font:14px/1.6 system-ui;color:#29372f;background:#f4f6f3}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:24px}button,select{padding:8px 14px;margin:4px;border:1px solid #ccd8ce;border-radius:6px;background:white;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.panel{background:white;border:1px solid #dce4dc;border-radius:8px;padding:20px;min-width:0}textarea{box-sizing:border-box;width:100%;height:200px;padding:12px;font:13px/1.5 monospace;border:1px solid #cbd5cd}#status{color:#527260}#scale-wrap{transform-origin:top left}a{color:#426e61}@media(max-width:750px){.grid{display:block}}</style></head><body><header><h1>Vanilla JavaScript integration</h1><a href="/">Local notebook ↗</a></header><p>One module. No framework, storage service or AI account required.</p><div><button id="mount">Mount</button><button id="destroy">Destroy</button><button id="undo">Undo</button><button id="redo">Redo</button><button id="read">Render read-only</button><select id="scale" aria-label="Scale"><option value="1">100%</option><option value="0.7">70% scale</option></select><span id="status" role="status"></span></div><div class="grid"><section class="panel"><h2>Editor</h2><div id="scale-wrap"><div id="editor"></div></div></section><section class="panel"><h2>Read-only, same renderer</h2><div id="reader"></div></section></div><h2>Markdown ↔ application state</h2><textarea id="source" aria-label="Markdown source"></textarea><button id="replace">Set Markdown</button><script type="module" src="./main.js"></script></body></html>
