<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>编辑器 / AI 验收 · Milkdown Notes</title>
    <link rel="stylesheet" href="/editor/style.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 20px;
        font: 14px/1.6 system-ui;
        color: #28332f;
      }
      h1 {
        font-size: 20px;
      }
      button,
      select,
      input {
        font: inherit;
        padding: 6px;
        border: 1px solid #ccd8ce;
        border-radius: 6px;
        background: white;
        max-width: 100%;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 12px 0;
      }
      #frame {
        width: 100%;
        max-width: 820px;
        border: 1px solid #dde4de;
        border-radius: 8px;
        min-height: 280px;
        margin: 16px auto;
        padding: 12px 0 90px;
        resize: horizontal;
        overflow: auto;
      }
      #editor {
        min-height: 150px;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        background: #f3f5f3;
        padding: 10px;
      }
      #results {
        padding-left: 22px;
      }
      li[data-result='fail'] {
        color: #b42318;
      }
      li[data-result='pass'] {
        color: #287140;
      }
      .hint {
        color: #687d6d;
        font-size: 12px;
      }
      #test-host {
        position: absolute;
        left: 0;
        top: 0;
        width: 400px;
        visibility: hidden;
        pointer-events: none;
      }
      label {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      @media (max-width: 400px) {
        body {
          padding: 10px;
        }
        #frame {
          margin-top: 12px;
        }
      }
    </style>
  </head>
  <body>
    <a href="/">返回笔记</a>
    <h1>Milkdown 编辑器 / AI 验收</h1>
    <p class="hint">
      测试正文、表格、图片、导航，以及真实 Milkdown AI 与 diff 插件。AI
      使用本地固定流式数据，不调用模型，不读写笔记文件。
    </p>
    <div class="controls">
      <button id="suite">运行完整回归</button><button id="reset">重置示例</button
      ><button id="palette">打开 AI 菜单</button
      ><label
        >侧栏宽度<select id="width">
          <option value="100%">随窗口</option>
          <option value="240px">240 px</option>
          <option value="320px">320 px</option>
          <option value="480px">480 px</option>
          <option value="820px">820 px</option>
        </select></label
      ><label
        >返回场景<select id="scenario">
          <option value="normal">正常流式</option>
          <option value="slow">慢速／取消</option>
          <option value="error">流中失败</option>
          <option value="empty">空返回</option>
        </select></label
      >
    </div>
    <p id="status" role="status">准备中</p>
    <div id="frame"><div id="editor"></div></div>
    <details>
      <summary>已确认的 Markdown 与调用上下文</summary>
      <pre id="markdown"></pre>
      <pre id="context"></pre>
    </details>
    <ol id="results"></ol>
    <div id="test-host"></div>
    <script type="module" src="/ai-test.js"></script>
  </body>
</html>
