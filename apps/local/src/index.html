<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Milkdown Notes · 本地笔记</title>
    <script>
      try {
        document.documentElement.dataset.theme =
          JSON.parse(localStorage.getItem('milkdown.notes.editorPreferences') || '{}')?.theme ===
          'dark'
            ? 'dark'
            : 'light';
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
    <link rel="stylesheet" href="/sidebar/style.css" />
    <link rel="stylesheet" href="/app.css" />
    <script type="importmap">
      {
        "imports": {
          "@local/milkdown-notes": "/editor/index.js",
          "@local/milkdown-sidebar": "/sidebar/index.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="sidebar"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
